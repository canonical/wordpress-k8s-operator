name: Terraform modules release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"

jobs:
  terraform-release:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@1be2f1c4d3f3852a02b9e31582960ee4323f93e5  # main
    permissions:
      contents: write
