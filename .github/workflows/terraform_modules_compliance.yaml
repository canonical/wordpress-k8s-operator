name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/terraform_modules_compliance.yaml"

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@0c8c3b8ab7c826146cb058bd73b62887e3b31944  # main
    with:
      terraform-directories: '["terraform/charm", "terraform/product"]'
