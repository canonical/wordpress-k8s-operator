name: Terraform modules release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"

jobs:
  terraform-release:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@3046da45237aa86dcdcd83c299e1380842b473cc  # main
    permissions:
      contents: write
