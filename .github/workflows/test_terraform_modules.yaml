name: Terraform modules tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/test_terraform_modules.yaml"

jobs:
  terraform-tests-k8s:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@c81a9cdd5acfba473f2f52a4cfbeed7132062df1  # main
    secrets: inherit
    with:
      k8s-controller: true
      terraform-directories: '["terraform/charm"]'
  terraform-tests-product:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@c81a9cdd5acfba473f2f52a4cfbeed7132062df1  # main
    secrets: inherit
    with:
      k8s-controller: false
      lxd-controller-with-k8s-cloud: true
      terraform-directories: '["terraform/product"]'
