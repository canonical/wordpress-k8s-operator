name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/terraform_modules_compliance.yaml"

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@3046da45237aa86dcdcd83c299e1380842b473cc  # main
    with:
      terraform-directories: '["terraform/charm", "terraform/product"]'
