name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/terraform_modules_compliance.yaml"

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@1be2f1c4d3f3852a02b9e31582960ee4323f93e5  # main
    with:
      terraform-directories: '["terraform/charm", "terraform/product"]'
