name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/terraform_modules_compliance.yaml"

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@c81a9cdd5acfba473f2f52a4cfbeed7132062df1  # main
    with:
      terraform-directories: '["terraform/charm", "terraform/product"]'
