name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/terraform_modules_compliance.yaml"

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@7872f6006323a38a3384052e39698ebfd7edfbb9  # main
    with:
      terraform-directories: '["terraform/charm", "terraform/product"]'
