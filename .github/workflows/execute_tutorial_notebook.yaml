name: Execute Tutorial Notebook

on:
  pull_request:

jobs:
  execute-notebook:
    name: Execute Tutorial Notebook
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build docs
        # This is the only job that actually executes the notebook. NBEXEC_DISABLE keeps
        # docs/conf.py from loading canonical-sphinx-notebooks at all for this build: the
        # extension forces execution off during builder-inited even when it is disabled
        # via config rather than omitted, which would prevent the fresh execution this
        # job exists to produce.
        env:
          NBEXEC_DISABLE: "1"
        run: |
          cd docs && make html-with-exec

      - name: Upload executed notebook artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-notebook
          path: docs/jupyter_execute/tutorial.ipynb
