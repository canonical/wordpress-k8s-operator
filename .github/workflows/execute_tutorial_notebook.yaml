name: Execute Tutorial Notebook

on:
  pull_request:

jobs:
  execute-notebook:
    name: Execute Tutorial Notebook
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build docs
        # This is the only job that actually executes the notebook. NBEXEC_DISABLE stops
        # the extension from fetching docs-latest and populating the cache from it; a
        # setup() hook in docs/conf.py then restores real execution, since the extension
        # would otherwise force it off the same way it does for "no usable outputs".
        env:
          NBEXEC_DISABLE: "1"
        run: |
          cd docs && make html-with-exec

      - name: Upload executed notebook artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-notebook
          path: docs/jupyter_execute/tutorial.ipynb
