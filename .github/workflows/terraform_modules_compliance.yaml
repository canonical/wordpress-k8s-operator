name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/terraform_modules_compliance.yaml"

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@8c89aed9e2cd37a613b172cd67fd672ae8dc05f6  # main
    with:
      terraform-directories: '["terraform/charm", "terraform/product"]'
