name: Execute Tutorial Notebook

on:
  pull_request:

jobs:
  execute-notebook:
    name: Execute Tutorial Notebook
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build docs
        # This is the only job that actually executes the notebook. The
        # canonical-sphinx-notebooks extension enables itself on CI as well as on Read
        # the Docs, so without NBEXEC_DISABLE it would populate the cache from the
        # previously published outputs and skip execution entirely -- republishing stale
        # outputs as though they were fresh.
        env:
          NBEXEC_DISABLE: "1"
        run: |
          cd docs && make html-with-exec

      - name: Upload executed notebook artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-notebook
          path: docs/jupyter_execute/tutorial.ipynb
