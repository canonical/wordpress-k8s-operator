name: Terraform modules release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"

jobs:
  terraform-release:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@8c89aed9e2cd37a613b172cd67fd672ae8dc05f6  # main
    permissions:
      contents: write
